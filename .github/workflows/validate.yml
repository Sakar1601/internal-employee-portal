name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend — validate doesn't need real state)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  ansible:
    name: Ansible syntax + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: pip install ansible-core ansible-lint

      - name: Install required collections
        run: ansible-galaxy collection install -r infra/ansible/requirements.yml

      - name: Syntax check
        run: ansible-playbook --syntax-check infra/ansible/site.yml

      - name: ansible-lint
        run: ansible-lint infra/ansible/site.yml
