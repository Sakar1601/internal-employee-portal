---
# community.hashi_vault requires the hvac Python library on whatever runs
# it -- neither AWX's default execution environment (quay.io/ansible/awx-ee)
# nor its task image bundle it, so vault_read/vault_write fail on a bare
# ModuleNotFoundError otherwise (masked by no_log, since Ansible censors
# the whole task result, not just the parts that would leak a secret).
- name: Ensure hvac is available on the control node for community.hashi_vault
  ansible.builtin.pip:
    name: hvac
    extra_args: --user
  delegate_to: localhost
  become: false

# These two tasks run on the control node, not the portal instance --
# delegate_to: localhost is what actually makes that true. Without it,
# Ansible executes the module over SSH on inventory_hostname like any
# other task, which cannot work here: the portal instance's egress is
# locked to VPC-only, so it has no route to Vault at all, by design.
- name: Fetch a short-lived database credential from Vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    path: "database/creds/app-role"
    auth_method: approle
    role_id: "{{ vault_role_id }}"
    secret_id: "{{ vault_secret_id }}"
  delegate_to: localhost
  become: false
  register: portal_db_creds_result
  no_log: true # the credential itself must never hit the job log

- name: Issue a TLS certificate from the internal PKI for this host
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    path: "pki/issue/lab-internal"
    auth_method: approle
    role_id: "{{ vault_role_id }}"
    secret_id: "{{ vault_secret_id }}"
    data:
      common_name: "{{ inventory_hostname }}.lab.internal"
  delegate_to: localhost
  become: false
  register: portal_issued_cert
  no_log: true

- name: Create a dedicated, unprivileged system user for the portal service
  ansible.builtin.user:
    name: portal
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Ensure the app and config directories exist with correct ownership
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: portal
    group: portal
    mode: "{{ item.mode }}"
  loop:
    - { path: /opt/portal/backend, mode: "0755" }
    - { path: /opt/portal/frontend, mode: "0755" }
    - { path: /etc/portal, mode: "0750" }
    - { path: /etc/portal/tls, mode: "0750" }

- name: Copy the backend application code
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../app/backend/app/"
    dest: /opt/portal/backend/app/
    owner: portal
    group: portal
    mode: "0750"
  notify: Restart portal service

- name: Copy the backend requirements file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../app/backend/requirements.txt"
    dest: /opt/portal/backend/requirements.txt
    owner: portal
    group: portal
    mode: "0640"

- name: Copy the pre-built wheelhouse (no network access needed on this host)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../app/backend/wheelhouse/"
    dest: /opt/portal/backend/wheelhouse/
    owner: portal
    group: portal
    mode: "0750"

- name: Create the backend virtualenv
  ansible.builtin.command:
    cmd: python3 -m venv /opt/portal/backend/.venv
    creates: /opt/portal/backend/.venv/bin/python

- name: Install backend dependencies from the wheelhouse only
  ansible.builtin.pip:
    requirements: /opt/portal/backend/requirements.txt
    virtualenv: /opt/portal/backend/.venv
    extra_args: "--no-index --find-links=/opt/portal/backend/wheelhouse"
  become: true
  notify: Restart portal service

- name: Fix ownership of the virtualenv (pip module runs as root via become)
  ansible.builtin.file:
    path: /opt/portal/backend/.venv
    state: directory
    owner: portal
    group: portal
    recurse: true

- name: Copy the pre-built frontend static bundle
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../app/frontend/dist/"
    dest: /opt/portal/frontend/dist/
    owner: portal
    group: portal
    mode: "0750"
  notify: Restart portal service

- name: Write the Vault-issued TLS certificate
  ansible.builtin.copy:
    content: "{{ portal_issued_cert.data.data.certificate }}"
    dest: /etc/portal/tls/cert.pem
    owner: portal
    group: portal
    mode: "0640"
  no_log: true
  notify: Restart portal service

- name: Write the Vault-issued TLS private key
  ansible.builtin.copy:
    content: "{{ portal_issued_cert.data.data.private_key }}"
    dest: /etc/portal/tls/key.pem
    owner: portal
    group: portal
    mode: "0600"
  no_log: true
  notify: Restart portal service

- name: Fetch the portal's own admin/JWT secrets from Vault
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    path: "secret/data/portal-admin"
    auth_method: approle
    role_id: "{{ vault_role_id }}"
    secret_id: "{{ vault_secret_id }}"
  delegate_to: localhost
  become: false
  register: portal_admin_secret
  no_log: true

- name: Set facts from the fetched secret
  ansible.builtin.set_fact:
    portal_jwt_secret: "{{ portal_admin_secret.data.data.data.jwt_secret }}"
    portal_admin_username: "{{ portal_admin_secret.data.data.data.admin_username }}"
    portal_admin_password_hash: "{{ portal_admin_secret.data.data.data.admin_password_hash }}"
  no_log: true

- name: Write the app environment file
  ansible.builtin.template:
    src: portal.env.j2
    dest: /etc/portal/portal.env
    owner: portal
    group: portal
    mode: "0640"
  no_log: true
  notify: Restart portal service

- name: Install the systemd unit
  ansible.builtin.copy:
    src: portal.service
    dest: /etc/systemd/system/portal.service
    mode: "0644"
  notify: Restart portal service

- name: Enable and start the portal service
  ansible.builtin.systemd:
    name: portal
    enabled: true
    state: started
    daemon_reload: true
