<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <title>Employee Portal</title>
    <meta name="description" content="An employee directory (FastAPI + React) deployed with Terraform, Vault, Ansible and AWX onto a host that cannot reach the internet. Watch the deployment and try the app in your browser." />

    <meta property="og:title" content="Employee Portal: a directory deployed like a regulated company would" />
